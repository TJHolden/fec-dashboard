<!DOCTYPE html>
<html lang="en">
<head><meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Republican FEC — National Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23a62422'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='22' fill='white'%3ER%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
:root{--bg:#f5f6f8;--s:#fff;--s2:#eef0f3;--t:#151720;--d:#6b7280;--b:#d4d8e0;--red:#a62422;--rL:#f5e3e3;--blu:#1e4b8f;--bL:#e2ecf7;--grn:#1a6b3c;--gL:#e3f1ea;--f:system-ui,-apple-system,'Segoe UI',sans-serif;--m:'SF Mono','Cascadia Code',monospace;--r:6px;--sh:0 1px 2px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1015;--s:#181b23;--s2:#21252e;--t:#dfe1e7;--d:#7f8594;--b:#2b2f3a;--red:#e25554;--rL:#2d1a1a;--blu:#5a9bf5;--bL:#1a2740;--grn:#3dbd6e;--gL:#162b1e;--sh:0 1px 2px rgba(0,0,0,.2)}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--f);background:var(--bg);color:var(--t);line-height:1.5}
.hdr{background:var(--s);border-bottom:1px solid var(--b);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:10}
.hdr h1{font-size:1rem;font-weight:700}.hdr-meta{font-size:.7rem;color:var(--d)}.main{max-width:1240px;margin:0 auto;padding:14px 12px 60px}
.ctrl{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:12px;margin-bottom:12px;box-shadow:var(--sh)}.cr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select,input[type=text]{font-family:var(--f);font-size:.8rem;padding:7px 10px;border:1px solid var(--b);border-radius:var(--r);background:var(--s2);color:var(--t);outline:none}select:focus,input:focus{border-color:var(--blu)}input[type=text]{flex:1;min-width:140px}
.btn{font-family:var(--f);font-size:.8rem;font-weight:600;padding:7px 14px;border:none;border-radius:var(--r);cursor:pointer;white-space:nowrap}.btn:hover{opacity:.88}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-load{background:var(--red);color:#fff}.btn-ghost{background:var(--s2);color:var(--t);border:1px solid var(--b)}
.sts{padding:9px 12px;border-radius:var(--r);font-size:.82rem;font-weight:500;display:none}.sts.on{display:block}.sts.ok{background:var(--s);border:1px solid var(--b);color:var(--t)}.sts.err{background:var(--rL);color:var(--red)}
.prog{margin-top:8px;display:none}.prog.on{display:block}.prog-bar{height:4px;background:var(--s2);border-radius:2px;overflow:hidden}.prog-fill{height:100%;background:var(--red);border-radius:2px;transition:width .3s}.prog-text{font-size:.7rem;color:var(--d);margin-top:2px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin-bottom:12px}.kpi{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:10px 12px;box-shadow:var(--sh)}.kv{font-family:var(--m);font-size:1.1rem;font-weight:700;color:var(--red)}.kl{font-size:.68rem;color:var(--d);margin-top:1px}
.tabs{display:flex;gap:2px;margin-bottom:10px;background:var(--s2);border-radius:var(--r);padding:3px}.tab{font-size:.76rem;font-weight:600;padding:7px 14px;border:none;border-radius:4px;cursor:pointer;background:transparent;color:var(--d);font-family:var(--f)}.tab:hover{color:var(--t)}.tab.on{background:var(--s);color:var(--t);box-shadow:var(--sh)}
.card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}.ch{padding:10px 14px;border-bottom:1px solid var(--b);font-weight:600;font-size:.82rem;display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap}.ch small{font-weight:400;color:var(--d);font-size:.7rem}.cb{padding:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.78rem}th{text-align:left;padding:7px 9px;border-bottom:2px solid var(--b);font-weight:600;color:var(--d);font-size:.68rem;white-space:nowrap}th.r{text-align:right}td{padding:7px 9px;border-bottom:1px solid var(--b);white-space:nowrap}tr:last-child td{border-bottom:none}tr:hover td{background:var(--s2)}
.mo{font-family:var(--m);font-size:.76rem;text-align:right}.bd{display:inline-block;font-weight:700;font-size:.68rem;padding:1px 5px;border-radius:4px;font-family:var(--m);background:var(--rL);color:var(--red)}.bs{background:var(--s2);color:var(--d);font-weight:500;font-size:.58rem;padding:1px 4px;border-radius:3px;margin-left:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.map-wrap{display:flex;justify-content:center;padding:4px 0}.map-grid{display:inline-grid;gap:3px}.mc{width:54px;height:40px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s;border:1px solid transparent}.mc:hover{transform:scale(1.1);z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.2);border-color:var(--t)}.mc .sc{font-weight:700;font-size:.68rem;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}.mc .sv{font-size:.5rem;color:rgba(255,255,255,.8);font-family:var(--m)}
.cs{display:inline-block;margin:3px;vertical-align:top}.cl{font-size:.6rem;font-weight:600;color:var(--d);text-align:center;margin-bottom:1px}.cg{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}.cc{width:20px;height:16px;border-radius:2px;cursor:pointer;transition:transform .1s;display:flex;align-items:center;justify-content:center;font-size:.46rem;font-weight:700;color:rgba(255,255,255,.8)}.cc:hover{transform:scale(1.3);z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tip{position:absolute;background:var(--s);border:1px solid var(--b);border-radius:6px;padding:9px 11px;box-shadow:0 4px 12px rgba(0,0,0,.12);font-size:.76rem;z-index:100;pointer-events:none;max-width:260px;display:none}
.legend{display:flex;align-items:center;gap:4px;margin:6px 0;justify-content:center;flex-wrap:wrap}.li{display:flex;align-items:center;gap:3px;font-size:.64rem;color:var(--d)}.lsw{width:12px;height:8px;border-radius:2px}

/* Master-detail sidebar layout */
.md-wrap{display:flex;border:1px solid var(--b);border-radius:var(--r);background:var(--s);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;min-height:500px}
.md-side{width:280px;min-width:280px;border-right:1px solid var(--b);overflow-y:auto;max-height:600px}
.md-side-search{padding:8px;border-bottom:1px solid var(--b);position:sticky;top:0;background:var(--s);z-index:1}
.md-side-search input{width:100%;font-size:.78rem;padding:6px 8px;border:1px solid var(--b);border-radius:4px;background:var(--s2);color:var(--t);outline:none;font-family:var(--f)}
.md-item{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--b);font-size:.82rem;transition:background .1s}
.md-item:last-child{border-bottom:none}
.md-item:hover{background:var(--s2)}
.md-item.active{background:var(--t);color:var(--s)}
.md-item .md-count{font-family:var(--m);font-size:.74rem;font-weight:600;opacity:.7}
.md-detail{flex:1;overflow-y:auto;max-height:600px;padding:16px}
.md-detail-head{font-size:1.1rem;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.md-detail-head .md-count{font-family:var(--m);font-size:.9rem;color:var(--d)}
.md-member{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--b)}
.md-member:last-child{border-bottom:none}
.md-member-name{font-size:.88rem;font-weight:500}
.md-member-dist{font-family:var(--m);font-size:.78rem;color:var(--d)}
.md-member-money{display:flex;gap:16px;align-items:center}
.md-member-money .md-col{text-align:right}
.md-member-money .md-col-label{font-size:.6rem;color:var(--d);text-transform:uppercase;letter-spacing:.03em}
.md-member-money .md-col-val{font-family:var(--m);font-size:.8rem;font-weight:600}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--t)}th .arrow{font-size:.6rem;margin-left:2px;opacity:.4}th .arrow.on{opacity:1}
@media(max-width:700px){.md-wrap{flex-direction:column}.md-side{width:100%;min-width:0;max-height:200px;border-right:none;border-bottom:1px solid var(--b)}.md-detail{max-height:none}}

@media(max-width:700px){.g2{grid-template-columns:1fr}.cr{flex-direction:column}select,input[type=text]{width:100%}.mc{width:40px;height:30px}.mc .sc{font-size:.56rem}.mc .sv{font-size:.42rem}}

@media(max-width:768px){
  .wrap{padding:8px}
  .hdr{flex-direction:column;gap:8px}
  .hdr h1{font-size:1rem}
  .kpi{flex-wrap:wrap}.kpi>div{flex:1 1 45%;min-width:120px}
  .g2{grid-template-columns:1fr}
  .md-layout{flex-direction:column}
  .md-sidebar{width:100%;max-height:200px;border-right:none;border-bottom:1px solid var(--b)}
  .md-detail{min-width:0}
  .md-detail-head{flex-direction:column;gap:4px}
  table{font-size:.7rem}
  th,td{padding:4px 5px}
  .tabs{flex-wrap:wrap}
  .tab{font-size:.7rem;padding:6px 10px}
  #cycleBtns{flex-wrap:wrap}
  #cycleBtns .tab{font-size:.64rem;padding:3px 6px}
  .filters{flex-wrap:wrap;gap:4px}
  .filters select,.filters input{font-size:.72rem;padding:4px 6px;min-width:0;flex:1 1 auto}
}
@media(max-width:480px){
  .kpi>div{flex:1 1 100%}
  .hdr h1{font-size:.88rem}
  table{display:block;overflow-x:auto}
}
</style>
</head>
<body>
<div class="hdr"><div><h1>FEC National Dashboard &#8212; Republican Caucus</h1><div class="hdr-meta" id="cycleLabel">2025–2026 Cycle</div></div><div style="display:flex;gap:2px;background:var(--s2);border-radius:4px;padding:2px" id="cycleBtns"></div></div>
<div class="main">
  <div class="ctrl"><div class="cr">
    <select id="metric" onchange="render()"><option value="receipts">Color: Raised</option><option value="coh">Color: COH</option><option value="disbursements">Color: Spent</option></select>
    <input type="text" id="search" placeholder="Search name, state, district&#8230;" oninput="render()">
    <select id="regionFilt" onchange="render()"><option value="">All regions</option><option value="Northeast">Northeast</option><option value="Midwest">Midwest</option><option value="South">South</option><option value="West">West</option></select>
      <select id="typFilt" onchange="render()"><option value="">All filers</option><option value="Incumbent">Incumbents</option><option value="Challenger">Challengers</option><option value="Open">Open</option><option value="General" selected>General candidates</option></select>
      <select id="minFilt" onchange="render();try{localStorage.setItem('fec_min_raised',this.value)}catch(e){}"><option value="0">Anyone</option><option value="1">More than $0</option><option value="5000" selected>$5K+</option><option value="25000">$25K+</option><option value="100000">$100K+</option></select>
  </div>
  <div class="prog" id="prog"><div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div><div class="prog-text" id="progText"></div></div>
  <div class="sts" id="sts"></div>
  </div>
  <div id="dash"></div>
</div>
<div class="tip" id="tip"></div>
<script>
const SN={AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",DE:"Delaware",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming"};
const GRID={AK:[0,0],ME:[0,10],WI:[1,5],VT:[1,9],NH:[1,10],WA:[2,0],ID:[2,1],MT:[2,2],ND:[2,3],MN:[2,4],MI:[2,6],NY:[2,8],MA:[2,9],CT:[2,10],RI:[2,11],OR:[3,0],NV:[3,1],WY:[3,2],SD:[3,3],IA:[3,4],IL:[3,5],IN:[3,6],OH:[3,7],PA:[3,8],NJ:[3,9],CA:[4,0],UT:[4,1],CO:[4,2],NE:[4,3],MO:[4,4],KY:[4,5],WV:[4,6],VA:[4,7],MD:[4,8],DE:[4,9],DC:[4,10],AZ:[5,1],NM:[5,2],KS:[5,3],AR:[5,4],TN:[5,5],NC:[5,6],SC:[5,7],GA:[5,8],OK:[6,3],LA:[6,4],MS:[6,5],AL:[6,6],TX:[7,3],FL:[7,8],HI:[8,0]};

var CYCLE=2026;
var CYCLES=[2028,2026,2024,2022,2020,2018,2016,2014,2012];
var qtrCycleInit=2026;
var REGIONS={
  "Northeast":["CT","ME","MA","NH","NJ","NY","PA","RI","VT"],
  "Midwest":["IL","IN","IA","KS","MI","MN","MO","NE","ND","OH","SD","WI"],
  "South":["AL","AR","DE","FL","GA","KY","LA","MD","MS","NC","OK","SC","TN","TX","VA","WV","DC"],
  "West":["AK","AZ","CA","CO","HI","ID","MT","NV","NM","OR","UT","WA","WY"]
};
let ALL=[],CHS=[];
function fmt(n){if(n==null||isNaN(n))return"\u2014";return"$"+Math.round(n).toLocaleString("en-US")}
function fK(n){if(n==null||isNaN(n))return"\u2014";if(n>=1e6)return"$"+(n/1e6).toFixed(1)+"M";if(n>=1e3)return"$"+(n/1e3).toFixed(0)+"K";return"$"+Math.round(n)}
function titleCase(s){return s.toLowerCase().replace(/(?:^|\s)\S/g,function(c){return c.toUpperCase()})}
function fmtName(raw){if(!raw)return"Unknown";var p=raw.split(",");if(p.length>=2)return titleCase(p[1].trim().split(" ")[0])+" "+titleCase(p[0].trim());return titleCase(raw)}
function setStatus(cls,html){var e=document.getElementById("sts");e.className="sts on "+cls;e.innerHTML=html}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function colorScale(v,mx){if(!v||v<=0)return"#ece8e0";if(!mx)return"#e8e4db";var t=Math.sqrt(Math.min(v/mx,1));return"rgb("+Math.round(245-105*t)+","+Math.round(227-185*t)+","+Math.round(227-185*t)+")"}
function txtCol(v,mx){if(!mx||!v)return"#555";var t=Math.sqrt(Math.min(v/mx,1));return t>.5?"#fff":"#1a1a2e"}
function stateData(list){var d={};list.forEach(function(m){if(!d[m.state])d[m.state]={code:m.state,name:m.sn,receipts:0,coh:0,disbursements:0,n:0,members:[]};var s=d[m.state];s.receipts+=m.receipts;s.coh+=m.coh;s.disbursements+=m.disbursements;s.n++;s.members.push(m)});return d}
function getFiltered(){var q=document.getElementById("search").value.toLowerCase();var ty=document.getElementById("typFilt").value;var reg=document.getElementById("regionFilt").value;var f=ALL.slice();if(q)f=f.filter(function(m){return m.name.toLowerCase().indexOf(q)>=0||m.sn.toLowerCase().indexOf(q)>=0||m.state.toLowerCase()===q||m.dist.toLowerCase().indexOf(q)>=0});if(ty==="General"){
      // One candidate per district: incumbent if exists, else top raiser
      var byD={};
      f.forEach(function(m){
        if(!byD[m.dist]){byD[m.dist]=m}
        else if(m.type==="Incumbent"){byD[m.dist]=m}
        else if(byD[m.dist].type!=="Incumbent"&&m.receipts>byD[m.dist].receipts){byD[m.dist]=m}
      });
      f=Object.values(byD);
    }else if(ty){f=f.filter(function(m){return m.type===ty})};if(reg&&REGIONS[reg])f=f.filter(function(m){return REGIONS[reg].indexOf(m.state)>=0});var minR=+(document.getElementById('minFilt')?document.getElementById('minFilt').value:5000);if(minR>0)f=f.filter(function(m){return m.type==="Incumbent"||m.receipts>=minR});return f}

// Tooltip via data attributes - no backtick issues
var tip=document.getElementById("tip");
document.addEventListener("mousemove",function(e){
  var el=e.target.closest("[data-tip]");
  if(el){
    tip.style.display="block";
    tip.innerHTML=el.getAttribute("data-tip");
    var x=e.pageX+12,y=e.pageY+12;
    if(e.clientX+272>window.innerWidth)x=e.pageX-260;
    if(e.clientY+132>window.innerHeight)y=e.pageY-120;
    tip.style.left=x+"px";tip.style.top=y+"px";
  }else if(!e.target.closest("svg")){tip.style.display="none"}
});

var curTab="congress";
function render(){
  CHS.forEach(function(c){c.destroy()});CHS=[];
  var list=getFiltered(),el=document.getElementById("dash");
  if(!ALL.length)return;
  var tR=0,tC=0,tS=0;list.forEach(function(m){tR+=m.receipts;tC+=m.coh;tS+=m.disbursements});
  var incs=list.filter(function(m){return m.type==="Incumbent"});
  var stSet={};list.forEach(function(m){stSet[m.state]=1});var nStates=Object.keys(stSet).length;
  el.innerHTML='<div class="kpi-row"><div class="kpi"><div class="kv">'+list.length+'</div><div class="kl">Candidates \u00b7 '+nStates+' states</div></div><div class="kpi"><div class="kv">'+fK(tR)+'</div><div class="kl">Total raised</div></div><div class="kpi"><div class="kv">'+fK(tC)+'</div><div class="kl">Cash on hand</div></div><div class="kpi"><div class="kv">'+fK(tS)+'</div><div class="kl">Total spent</div></div><div class="kpi"><div class="kv">'+fK(incs.length?Math.round(tR/incs.length):0)+'</div><div class="kl">Avg. raised (inc.)</div></div></div>'
  +'<div class="tabs"><button class="tab '+(curTab==="congress"?"on":"")+'" onclick="curTab=\'congress\';render()">Congressional Map</button><button class="tab '+(curTab==="national"?"on":"")+'" onclick="curTab=\'national\';render()">National Map</button><button class="tab '+(curTab==="list"?"on":"")+'" onclick="curTab=\'list\';render()">List View</button><button class="tab '+(curTab==="quarterly"?"on":"")+'" onclick="curTab=\'quarterly\';render()">Quarterly Detail</button></div><div id="view"></div>';
  if(curTab==="national")renderNat(list);
  else if(curTab==="congress")renderCong(list);
  else if(curTab==="quarterly")renderQtr(list);
  else renderList(list);
}

var natStyle="map";
 // "map" (geographic, default) or "tiles"
var stateGeo=null;
var stateGeoLoading=false;

function loadStateGeo(cb){
  if(stateGeo){cb(stateGeo);return}
  // Primary: CDN fetch
  fetch("https://cdn.jsdelivr.net/npm/us-atlas@3/states-albers-10m.json")
    .then(function(r){return r.json()})
    .then(function(topo){
      stateGeo=topojson.feature(topo,topo.objects.states).features;
      stateGeo._mesh=topojson.mesh(topo,topo.objects.states,function(a,b){return a!==b});
      cb(stateGeo);
    })
    .catch(function(){
      // Fallback: embedded data
      stateGeo=topojson.feature(STATES_TOPO,STATES_TOPO.objects.states).features;
      stateGeo._mesh=topojson.mesh(STATES_TOPO,STATES_TOPO.objects.states,function(a,b){return a!==b});
      cb(stateGeo);
    });
}

function renderNat(list){
  var met=document.getElementById("metric").value;
  var sd=stateData(list);
  var vals=[];for(var k in sd)vals.push(sd[k][met]);
  var mx=Math.max.apply(null,vals.concat([1]));
  var ml={receipts:"Raised",coh:"Cash on Hand",disbursements:"Spent"}[met];
  var stS=Object.values(sd).sort(function(a,b){return b[met]-a[met]}).slice(0,15);
  var topR=list.slice(0,20);

  // Toggle buttons
  var toggleHtml='<div style="display:flex;gap:2px;background:var(--s2);border-radius:4px;padding:2px;margin-right:auto">'
    +'<button class="tab'+(natStyle==="map"?" on":"")+'" onclick="natStyle=\'map\';render()" style="font-size:.7rem;padding:5px 10px">Map</button>'
    +'<button class="tab'+(natStyle==="tiles"?" on":"")+'" onclick="natStyle=\'tiles\';render()" style="font-size:.7rem;padding:5px 10px">Tiles</button></div>';

  var legendHtml='<div class="legend"><div class="li"><div class="lsw" style="background:'+colorScale(.05*mx,mx)+'"></div>Low</div><div class="li"><div class="lsw" style="background:'+colorScale(.5*mx,mx)+'"></div></div><div class="li"><div class="lsw" style="background:'+colorScale(mx,mx)+'"></div>High</div><div class="li" style="margin-left:10px;font-size:.6rem">Click state to filter</div></div>';

  document.getElementById("view").innerHTML='<div class="card"><div class="ch"><span>National \u2014 '+ml+' by State</span>'+toggleHtml+'</div><div class="cb">'
    +legendHtml
    +'<div id="natMapArea"></div>'
    +'</div></div>'
    
    +'<div class="g2"><div class="card"><div class="ch">Top 15 States</div><div class="cb"><div style="height:340px"><canvas id="c1"></canvas></div></div></div>'
    +'<div class="card"><div class="ch">Top 20 Fundraisers</div><div class="cb"><div style="height:340px"><canvas id="c2"></canvas></div></div></div></div>';

  if(natStyle==="tiles"){
    renderNatTiles(sd,met,mx);
  }else{
    var area=document.getElementById("natMapArea");
    area.innerHTML='<div style="text-align:center;color:var(--d);font-size:.8rem;padding:20px">Loading map\u2026</div>';
    loadStateGeo(function(features){
      if(!features){renderNatTiles(sd,met,mx);return}
      renderNatGeo(features,sd,met,mx);
    });
  }

  mkCh("c1","bar",stS.map(function(s){return s.code}),[{data:stS.map(function(s){return s[met]}),backgroundColor:"#a62422",borderRadius:3}],{plugins:{legend:{display:false}}});
  mkCh("c2","bar",topR.map(function(m){return m.name.split(" ").pop()}),[{label:"Raised",data:topR.map(function(m){return m.receipts}),backgroundColor:"#a62422",borderRadius:3},{label:"COH",data:topR.map(function(m){return m.coh}),backgroundColor:"#1e4b8f",borderRadius:3}],{plugins:{legend:{position:"bottom",labels:{boxWidth:10,padding:8}}}});
}

function renderNatGeo(features,sd,met,mx){
  var area=document.getElementById("natMapArea");
  if(!area)return;
  area.innerHTML="";

  var byFips={};
  Object.keys(FIPS).forEach(function(fp){
    var st=FIPS[fp];
    if(sd[st])byFips[fp]=sd[st];
  });

  var svg=d3.select(area).append("svg")
    .attr("viewBox","0 0 975 610")
    .attr("width","100%")
    .style("display","block");

  var path=d3.geoPath();

  svg.selectAll("path.state")
    .data(features)
    .enter().append("path")
    .attr("class","state")
    .attr("d",path)
    .attr("fill",function(d){
      var s=byFips[d.id];
      if(!s||!s.n)return "#ece8e0";
      return colorScale(s[met],mx);
    })
    .attr("stroke","#8a8070")
    .attr("stroke-width",0.8)
    .style("cursor","pointer")
    .on("mouseenter",function(ev,d){
      d3.select(this).attr("stroke","#14213d").attr("stroke-width",2);
      var s=byFips[d.id];
      var st=FIPS[d.id]||"";
      var infoH="";
      if(s&&s.n){
        infoH='<div style="font-weight:700;font-size:.88rem;margin-bottom:4px">'+s.name+'</div>'
          +'<div style="font-size:.72rem;color:var(--d);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--b)">'+s.n+' Republican candidate'+(s.n>1?"s":"")+'</div>'
          +'<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Raised</span><span style="font-family:var(--m);font-weight:600">'+fmt(s.receipts)+'</span></div>'
          +'<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>COH</span><span style="font-family:var(--m);font-weight:600">'+fmt(s.coh)+'</span></div>'
          +'<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Spent</span><span style="font-family:var(--m);font-weight:600">'+fmt(s.disbursements)+'</span></div>'
          +'<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>Avg. Raised</span><span style="font-family:var(--m);font-weight:600">'+fK(s.receipts/s.n)+'</span></div>'
          +'<div style="margin-top:10px;font-size:.68rem;color:var(--d)">Click for state detail</div>';
      }else{
        infoH='<div style="font-weight:700;margin-bottom:4px">'+(SN[st]||st||"Unknown")+'</div><div style="color:var(--d)">No Republican candidates</div>';
      }
      tip.style.display="block";tip.innerHTML=infoH;
    })
    .on("mousemove",function(ev){
      var x=ev.pageX+14,y=ev.pageY+14;
      if(ev.clientX+280>window.innerWidth)x=ev.pageX-270;
      if(ev.clientY+200>window.innerHeight)y=ev.pageY-200;
      tip.style.left=x+"px";tip.style.top=y+"px";
    })
    .on("mouseleave",function(){
      d3.select(this).attr("stroke","#8a8070").attr("stroke-width",0.8);tip.style.display="none";
    })
    .on("click",function(ev,d){
      var st=FIPS[d.id];
      if(st){showStatePanel(st)}
    });

  // Draw state borders mesh on top for clean lines
  if(stateGeo._mesh){
    svg.append("path")
      .datum(stateGeo._mesh)
      .attr("fill","none")
      .attr("stroke","#8a8070")
      .attr("stroke-width",0.8)
      .attr("d",path)
      .style("pointer-events","none");
  }
}

function renderNatTiles(sd,met,mx){
  var area=document.getElementById("natMapArea");
  if(!area)return;
  var cells="";
  var entries=Object.keys(GRID);
  for(var i=0;i<entries.length;i++){
    var st=entries[i],pos=GRID[st],r=pos[0],c=pos[1];
    var s=sd[st],val=s?s[met]:0;
    var bg=s?colorScale(val,mx):"var(--s2)";
    var tc=s?txtCol(val,mx):"var(--d)";
    var tipHtml=s?'<div style="font-weight:700;margin-bottom:2px">'+s.name+' ('+s.n+' GOP)</div><div style="display:flex;justify-content:space-between;gap:10px;font-size:.72rem"><span>Raised</span><span style="font-family:var(--m);font-weight:600">'+fmt(s.receipts)+'</span></div><div style="display:flex;justify-content:space-between;gap:10px;font-size:.72rem"><span>COH</span><span style="font-family:var(--m);font-weight:600">'+fmt(s.coh)+'</span></div><div style="display:flex;justify-content:space-between;gap:10px;font-size:.72rem"><span>Spent</span><span style="font-family:var(--m);font-weight:600">'+fmt(s.disbursements)+'</span></div>'
      :'<div style="font-weight:700">'+(SN[st]||st)+'</div><div>No data</div>';
    cells+='<div class="mc" data-tip="'+tipHtml.replace(/"/g,"&quot;")+'" style="grid-row:'+(r+1)+';grid-column:'+(c+1)+';background:'+bg+';color:'+tc+'" onclick="showStatePanel(\''+st+'\')"><span class="sc">'+st+'</span><span class="sv">'+(s?fK(val):"\u2014")+'</span></div>';
  }
  area.innerHTML='<div class="map-wrap"><div class="map-grid" style="grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(9,1fr)">'+cells+'</div></div>';
}




function showStatePanel(st){
  var stateName=SN[st]||st;
  var met=document.getElementById("metricSel")?document.getElementById("metricSel").value:"receipts";
  var ml={receipts:"Raised",coh:"COH",disbursements:"Spent"}[met];
  var ty=document.getElementById("typFilt")?document.getElementById("typFilt").value:"";
  var allM=ALL.filter(function(m){return m.state===st});
  var members=allM;
  if(ty==="General"){var byD={};allM.forEach(function(m){if(!byD[m.dist])byD[m.dist]=m;else if(m.type==="Incumbent")byD[m.dist]=m;else if(byD[m.dist].type!=="Incumbent"&&m.receipts>byD[m.dist].receipts)byD[m.dist]=m});members=Object.values(byD)}
  else if(ty){members=allM.filter(function(m){return m.type===ty})}
  members.sort(function(a,b){var da=+(a.dist.split("-")[1])||0,db=+(b.dist.split("-")[1])||0;return da-db});
  var stMx=Math.max.apply(null,members.map(function(m){return m[met]}).concat([1]));

  // Build race list rows
  var totR=0,totC=0;members.forEach(function(m){totR+=m.receipts;totC+=m.coh});
  var raceRows='<div style="display:grid;grid-template-columns:44px minmax(0,1fr) 80px 80px;gap:8px;align-items:center;padding:8px 12px;border-bottom:2px solid var(--b);font-size:12px;font-weight:700;background:var(--s2)"><span></span><span>Total</span><span style="font-family:var(--m);text-align:right;color:var(--red)">'+fK(totR)+'</span><span style="font-family:var(--m);text-align:right">'+fK(totC)+'</span></div>';
  members.forEach(function(m,i){
    var dNum=m.dist.split("-")[1]||"";if(dNum==="00")dNum="AL";
    raceRows+='<div class="sp-row" data-dist="'+m.dist+'" onclick="document.querySelector(\'.sp-overlay\').remove();showCandidate(\''+m.dist+'\')" style="display:grid;grid-template-columns:44px minmax(0,1fr) 80px 80px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--b);cursor:pointer;font-size:12px" onmouseenter="this.style.background=\'var(--s2)\'" onmouseleave="this.style.background=\'\'">'
      +'<span style="font-family:var(--m);font-weight:700">'+dNum+'</span>'
      +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span style="font-weight:600;color:var(--red)">'+m.name+'</span> <span style="color:var(--d);font-size:10px">'+m.type+'</span></span>'
      +'<span style="font-family:var(--m);text-align:right;font-weight:600;color:var(--red)">'+fK(m.receipts)+'</span>'
      +'<span style="font-family:var(--m);text-align:right">'+fK(m.coh)+'</span>'
      +'</div>';
  });

  var overlay=document.createElement("div");
  overlay.className="sp-overlay";
  overlay.style.cssText="position:fixed;inset:0;background:rgba(15,26,46,.4);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s";
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove()};

  var panel=document.createElement("div");
  panel.style.cssText="width:min(1100px,100%);height:min(80vh,720px);background:var(--s);border:1px solid var(--b);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(15,26,46,.3)";
  panel.onclick=function(e){e.stopPropagation()};

  // Header
  panel.innerHTML='<div style="padding:16px 22px 12px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:14px">'
    +'<span style="font-family:var(--m);font-size:16px;font-weight:700;background:var(--s2);border-radius:7px;padding:7px 11px">'+st+'</span>'
    +'<div style="flex:1"><div style="font-size:22px;font-weight:900;letter-spacing:-.3px">'+stateName+'</div>'
    +'<div style="font-size:12px;color:var(--d)">'+members.length+' district'+(members.length>1?"s":"")+'</div></div>'
    +'<button onclick="this.closest(\'.sp-overlay\').remove()" style="width:36px;height:36px;border-radius:18px;border:1px solid var(--b);background:var(--s);color:var(--d);font-size:18px;cursor:pointer">\u00d7</button></div>'
    // Body: map left, list right
    +'<div style="flex:1;display:grid;grid-template-columns:minmax(0,0.8fr) minmax(320px,1fr);min-height:0;overflow:hidden">'
    +'<div style="border-right:1px solid var(--b);display:flex;flex-direction:column;min-height:0">'
    +'<div style="padding:12px 20px 8px;font-size:14px;font-weight:700">Districts \u2014 '+ml+'</div>'
    +'<div id="spMap" style="flex:0 1 auto;max-height:280px;padding:0 16px;position:relative;display:flex;align-items:center;justify-content:center"><div style="color:var(--d);font-size:12px;animation:pulse 1.5s infinite">Loading districts\u2026</div></div>'
    +'<div style="padding:4px 20px 10px;font-size:10px;color:var(--d);text-align:center">Hover for details \u00b7 Click for full profile</div></div>'
    +'<div style="display:flex;flex-direction:column;min-height:0">'
    +'<div style="padding:12px 16px;display:grid;grid-template-columns:44px minmax(0,1fr) 80px 80px;gap:8px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--d);border-bottom:1px solid var(--b)"><span>Dist</span><span>Candidate</span><span style="text-align:right">Raised</span><span style="text-align:right">COH</span></div>'
    +'<div style="flex:1;overflow-y:auto;min-height:0">'+raceRows+'</div></div></div>';

  overlay.appendChild(panel);
  document.body.appendChild(overlay);
  function spEsc(e){if(e.key==="Escape"){overlay.remove();document.removeEventListener("keydown",spEsc)}}
  document.addEventListener("keydown",spEsc);

  // Add CSS animation
  if(!document.getElementById("spStyle")){
    var sty=document.createElement("style");sty.id="spStyle";
    sty.textContent="@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}.sp-overlay{animation:fadeIn .15s}@media(max-width:768px){.sp-overlay>div>div:last-child{grid-template-columns:1fr!important;grid-template-rows:auto 1fr!important}}";
    document.head.appendChild(sty);
  }

  // Load district map
  var stFips=Object.keys(FIPS).find(function(k){return FIPS[k]===st});
  if(!stFips)return;
  // Use embedded CD120 instead of TIGERweb
  var stFeats=CD120.features.filter(function(f){return String(f.id||"").padStart(4,"0").substring(0,2)===stFips});
  (function(){
      if(!stFeats.length)return;
      var feats=stFeats.map(function(f){
        var gid=String(f.id||"").padStart(4,"0");
        var dd=gid.substring(2);
        var dNum=/^0+$/.test(dd)?"AL":String(+dd);
        var dPad=dNum==="AL"?"00":dd;
        return{type:"Feature",geometry:f.geometry,properties:{num:dNum,key:st+"-"+dPad}};
      });
      var mapDiv=document.getElementById("spMap");
      if(!mapDiv)return;
      mapDiv.innerHTML="";
      var wrap=document.createElement("div");wrap.style.cssText="position:relative;width:100%";
      mapDiv.appendChild(wrap);
      var W=320,H=240;
      var proj=d3.geoMercator().fitExtent([[8,8],[W-8,H-8]],{type:"FeatureCollection",features:feats});
      var path=d3.geoPath(proj);
      var byD2={};members.forEach(function(m){byD2[m.dist]=m});
      var items=feats.map(function(f){var d=path(f);if(!d)return null;var c=path.centroid(f);var b=path.bounds(f);var bw=b?Math.abs(b[1][0]-b[0][0]):20;var bh=b?Math.abs(b[1][1]-b[0][1]):20;return{d:d,c:c&&isFinite(c[0])&&isFinite(c[1])?c:null,num:f.properties.num,key:f.properties.key,bw:bw,bh:bh}}).filter(Boolean);
      var svg=d3.select(wrap).append("svg").attr("viewBox","0 0 "+W+" "+H).attr("width","100%").style("display","block");
      svg.selectAll("path.dist").data(items).enter().append("path")
        .attr("class","dist").attr("d",function(x){return x.d})
        .attr("fill",function(x){var m=byD2[x.key];if(!m)return"#ece8e0";return colorScale(m[met],stMx)})
        .attr("stroke","rgba(255,255,255,.8)").attr("stroke-width",1).style("cursor","pointer")
        .on("mouseenter",function(ev,x){
          d3.select(this).attr("stroke","#c9a227").attr("stroke-width",2.5);
          var m=byD2[x.key];
          var hc=document.getElementById("spHover");
          if(!hc){hc=document.createElement("div");hc.id="spHover";wrap.appendChild(hc)}
          var h=m?'<div style="font-weight:700;font-size:13px">'+m.name+'</div><div style="font-size:11px;color:#6e7689;margin:2px 0 6px">District '+x.num+' \u00b7 '+m.type+'</div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px"><span>Raised</span><span style="font-family:var(--m);font-weight:600;color:var(--red)">'+fK(m.receipts)+'</span></div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px"><span>COH</span><span style="font-family:var(--m);font-weight:600">'+fK(m.coh)+'</span></div><div style="display:flex;justify-content:space-between;font-size:11px"><span>Spent</span><span style="font-family:var(--m);font-weight:600">'+fK(m.disbursements)+'</span></div>'
            :'<div style="font-weight:700;font-size:13px">District '+x.num+'</div><div style="font-size:11px;color:#6e7689">No Republican candidate</div>';
          hc.innerHTML=h;
          if(x.c)hc.style.cssText="position:absolute;background:var(--s);border:1px solid var(--b);border-radius:8px;padding:10px 12px;pointer-events:none;z-index:5;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.15);left:"+Math.min(70,Math.max(0,x.c[0]/W*100+2))+"%;top:"+Math.min(60,Math.max(0,x.c[1]/H*100))+"%";
          hc.style.display="block";
        })
        .on("mouseleave",function(){d3.select(this).attr("stroke","rgba(255,255,255,.8)").attr("stroke-width",1);var hc=document.getElementById("spHover");if(hc)hc.style.display="none"})
        .on("click",function(ev,x){var m=byD2[x.key];if(m){overlay.remove();showCandidate(x.key)}});
      svg.selectAll("text.dlabel").data(items.filter(function(x){return x.c})).enter().append("text")
        .attr("class","dlabel").attr("x",function(x){return x.c[0]}).attr("y",function(x){return x.c[1]})
        .attr("text-anchor","middle").attr("dominant-baseline","central")
        .attr("font-size",function(x){var sz=Math.min(x.bw,x.bh)*0.4;return Math.max(6,Math.min(16,sz))+"px"})
        .attr("font-weight","700")
        .attr("fill",function(x){var m=byD2[x.key];return m?txtCol(m[met],stMx):"#999"})
        .attr("pointer-events","none").attr("paint-order","stroke").attr("stroke",function(x){var m=byD2[x.key];if(!m)return"rgba(255,255,255,.6)";var t=Math.sqrt(Math.min(m[met]/stMx,1));return t>.5?"rgba(0,0,0,.35)":"rgba(255,255,255,.7)"}).attr("stroke-width",function(x){var sz=Math.min(x.bw,x.bh)*0.4;return Math.max(1.5,Math.min(3,sz*0.25))+"px"}).text(function(x){return x.num});
    })();
}


function showCandidate(dist){
  var m=null;
  ALL.forEach(function(c){if(c.dist===dist&&(!m||c.receipts>m.receipts))m=c});
  if(!m)return;
  
  // Build quarterly rows if available
  var qtrHtml="";
  if(m.periods&&m.periods.length){
    var qtrOnly=/^(Q[1-4]|Year-End) \d{4}$/;
    var periods=m.periods.filter(function(p){return qtrOnly.test(p.label)});
    if(periods.length){
      qtrHtml='<div style="margin-top:14px;border-top:1px solid var(--b);padding-top:10px"><div style="font-weight:600;margin-bottom:6px;font-size:.8rem">Quarterly History</div>'
        +'<table style="width:100%;font-size:.72rem;border-collapse:collapse"><tr style="color:var(--d)"><th style="text-align:left;padding:3px 6px">Period</th><th style="text-align:right;padding:3px 6px">Raised</th><th style="text-align:right;padding:3px 6px">COH</th></tr>';
      periods.forEach(function(p){
        qtrHtml+='<tr><td style="padding:3px 6px">'+p.label+'</td><td style="text-align:right;padding:3px 6px;font-family:var(--m)">'+fK(p.raised)+'</td><td style="text-align:right;padding:3px 6px;font-family:var(--m)">'+fK(p.coh)+'</td></tr>';
      });
      qtrHtml+='</table></div>';
    }
  }
  
  var h='<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px" onclick="if(event.target===this)this.remove()">'
    +'<div style="background:var(--s);border:1px solid var(--b);border-radius:10px;padding:20px 24px;max-width:460px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.2)">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">'
    +'<div><div style="font-size:1.1rem;font-weight:700">'+m.name+'</div>'
    +'<div style="font-size:.78rem;color:var(--d);margin-top:2px">'+m.dist+' \u00b7 '+(SN[m.state]||m.state)+' \u00b7 '+m.type+'</div></div>'
    +'<button onclick="this.closest(\x27[style*=fixed]\x27).remove()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--d);padding:0 4px">\u2715</button></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px">'
    +'<div style="background:var(--s2);border-radius:6px;padding:10px"><div style="font-size:.68rem;color:var(--d)">Total Raised</div><div style="font-size:1rem;font-weight:700;font-family:var(--m);color:var(--red)">'+fmt(m.receipts)+'</div></div>'
    +'<div style="background:var(--s2);border-radius:6px;padding:10px"><div style="font-size:.68rem;color:var(--d)">Cash on Hand</div><div style="font-size:1rem;font-weight:700;font-family:var(--m)">'+fmt(m.coh)+'</div></div>'
    +'<div style="background:var(--s2);border-radius:6px;padding:10px"><div style="font-size:.68rem;color:var(--d)">Total Spent</div><div style="font-size:1rem;font-weight:700;font-family:var(--m)">'+fmt(m.disbursements)+'</div></div>'
    +'<div style="background:var(--s2);border-radius:6px;padding:10px"><div style="font-size:.68rem;color:var(--d)">Individual</div><div style="font-size:1rem;font-weight:700;font-family:var(--m)">'+fmt(m.indiv)+'</div></div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
    +'<div style="background:var(--s2);border-radius:6px;padding:10px"><div style="font-size:.68rem;color:var(--d)">PAC</div><div style="font-size:1rem;font-weight:700;font-family:var(--m)">'+fmt(m.pac)+'</div></div>'
    +'<div style="background:var(--s2);border-radius:6px;padding:10px"><div style="font-size:.68rem;color:var(--d)">Candidate ID</div><div style="font-size:.82rem;font-weight:500;font-family:var(--m)">'+m.candidateId+'</div></div>'
    +'</div>'
    +qtrHtml
    +'<div style="margin-top:14px;text-align:center"><a href="https://www.fec.gov/data/candidate/'+m.candidateId+'/" target="_blank" style="font-size:.76rem;color:var(--red)">View on FEC.gov \u2192</a></div>'
    +'</div></div>';
  
  var el=document.createElement("div");el.innerHTML=h;document.body.appendChild(el.firstChild);
}


var FIPS={

  var fips=id.substring(0,2);
  var dist=id.substring(2);
  var st=FIPS[fips];
  if(!st)return null;
  return st+"-"+dist;
}

function fixDistrictGeom(g){
  if(!g)return null;
  function fixPoly(rings){
    rings=(rings||[]).filter(function(r){return Array.isArray(r)&&r.length>=4});
    if(!rings.length)return null;
    if(d3.geoArea({type:"Polygon",coordinates:rings})>2*Math.PI)
      rings=rings.map(function(r){return r.slice().reverse()});
    if(d3.geoArea({type:"Polygon",coordinates:rings})>2*Math.PI)
      rings=[rings[0].slice().reverse()].filter(function(r){return d3.geoArea({type:"Polygon",coordinates:[r]})<=2*Math.PI});
    return rings.length?rings:null;
  }
  if(g.type==="Polygon"){var c=fixPoly(g.coordinates);return c?{type:"Polygon",coordinates:c}:null}
  if(g.type==="MultiPolygon"){var cs=(g.coordinates||[]).map(fixPoly).filter(Boolean);return cs.length?{type:"MultiPolygon",coordinates:cs}:null}
  return null;
}

var qtrSelState="ALL";
var qtrSortCol="dist";
var qtrSortAsc=true;
function qtrSort(col){qtrSortAsc=sortOn(col,qtrSortCol,qtrSortAsc);qtrSortCol=col;render()}
function filterQtrSide(q){q=q.toLowerCase();var items=document.querySelectorAll("#qtrSide .md-item");items.forEach(function(el){el.style.display=el.textContent.toLowerCase().indexOf(q)>=0?"":"none"})}

function renderQtr(list){
  var withQ=list.filter(function(m){return m.periods&&m.periods.length>0});
  var sd={};withQ.forEach(function(m){if(!sd[m.state])sd[m.state]={code:m.state,name:m.sn,n:0,members:[]};sd[m.state].n++;sd[m.state].members.push(m)});
  var stS=Object.values(sd).sort(function(a,b){return a.name<b.name?-1:1});
  if(!withQ.length){document.getElementById("view").innerHTML='<div class="card"><div class="cb" style="text-align:center;padding:30px;color:var(--d)">No quarterly report data available for this cycle.</div></div>';return}
  var totalN=withQ.length;
  var side='<div class="md-side-search"><input type="text" placeholder="Search..." oninput="filterQtrSide(this.value)"></div>';
  side+='<div class="md-item'+(qtrSelState==="ALL"?" active":"")+'" onclick="qtrSelState=\'ALL\';render()"><span style="font-weight:700">National</span><span class="md-count">'+totalN+'</span></div>';
  stS.forEach(function(s){
    side+='<div class="md-item'+(s.code===qtrSelState?" active":"")+'" onclick="qtrSelState=\''+s.code+'\';render()">'
      +'<span>'+s.name+' ('+s.code+')</span><span class="md-count">'+s.n+'</span></div>';
  });
  var ms,title,count;
  if(qtrSelState==="ALL"){ms=withQ;title="National";count=totalN}
  else{var sel=sd[qtrSelState];if(!sel){ms=[];title="Select a state";count=0}else{ms=sel.members;title=sel.name+" ("+sel.code+")";count=sel.n}}
  ms=sortMembers(ms,qtrSortCol,qtrSortAsc);
  // Only show Q1, Q2, Q3, Q4, Year-End columns (skip Pre-Primary, Pre-General, etc.)
  var qtrOnly=/^(Q[1-4]|Year-End) \d{4}$/;
  var labelSet={},labelOrder=[];
  ms.forEach(function(m){m.periods.forEach(function(p){if(qtrOnly.test(p.label)&&!labelSet[p.label]){labelSet[p.label]=1;labelOrder.push(p.label)}})});
  // Sort most recent first: Q3 2026, Q2 2026, Q1 2026, Year-End 2025, Q4 2025...
  labelOrder.sort(function(a,b){
    var ya=a.match(/\d{4}/),yb=b.match(/\d{4}/);
    if(!ya||!yb)return 0;
    if(yb[0]!==ya[0])return yb[0]-ya[0];
    var order={"Q1":1,"Q2":2,"Q3":3,"Q4":4,"Year-End":5};
    var qa=order[a.replace(/ \d{4}/,"")]||0,qb=order[b.replace(/ \d{4}/,"")]||0;
    return qb-qa;
  });
  function qh(col,label){var isA=qtrSortCol===col;return '<th class="sortable'+(col!=="dist"&&col!=="name"?" r":"")+'" onclick="qtrSort(\''+col+'\')">'+label+'<span class="arrow'+(isA?" on":"")+'"> '+(isA?(qtrSortAsc?"&#9650;":"&#9660;"):"&#9650;")+'</span></th>'}
  var detail='<div class="md-detail-head"><span>'+title+'</span><span class="md-count">'+count+'</span></div>';
  detail+='<div class="tw"><table><thead><tr>'+qh("dist","District")+qh("name","Name")+(qtrSelState==="ALL"?qh("state","State"):"")+qh("receipts","Overall")+qh("coh","COH");
  labelOrder.forEach(function(l){detail+='<th class="r" style="font-size:.6rem">'+l.replace("PRE-","Pre-").replace("POST-","Post-")+'</th>'});
  detail+='</tr></thead><tbody>';
  ms.forEach(function(m){
    detail+='<tr style="cursor:pointer" onclick="showCandidate(\''+m.dist+'\')" title="Click for details"><td><span class="bd">'+m.dist+'</span></td><td>'+m.name+'<span class="bs">'+m.type+'</span></td>'
      +(qtrSelState==="ALL"?'<td style="font-size:.72rem;color:var(--d)">'+m.sn+'</td>':'')
      +'<td class="mo">'+fmt(m.receipts)+'</td><td class="mo">'+fmt(m.coh)+'</td>';
    labelOrder.forEach(function(l){var p=null;for(var i=0;i<m.periods.length;i++){if(m.periods[i].label===l){p=m.periods[i];break}}
      detail+='<td class="mo" style="font-size:.7rem">'+(p?fK(p.raised):"&#8212;")+'</td>'});
    detail+='</tr>'});
  detail+='</tbody></table></div>';
  detail+='<div style="margin-top:12px"><button class="btn btn-ghost" onclick="'+(qtrSelState==="ALL"?"exportCSV()":"exportStateCSV(\'"+qtrSelState+"\')")+'">&#8595; Export'+(qtrSelState!=="ALL"?" "+qtrSelState:"")+'</button></div>';
  document.getElementById("view").innerHTML='<div class="md-wrap"><div class="md-side" id="qtrSide">'+side+'</div><div class="md-detail">'+detail+'</div></div>';
}

function sortOn(col,cur,asc){return col===cur?!asc:true}

function sortMembers(ms,col,asc){
  var sorted=ms.slice();
  sorted.sort(function(a,b){
    var va,vb;
    if(col==="name"){va=a.name.toLowerCase();vb=b.name.toLowerCase();return asc?(va<vb?-1:va>vb?1:0):(va>vb?-1:va<vb?1:0)}
    if(col==="dist"){va=a.dist;vb=b.dist;return asc?(va<vb?-1:va>vb?1:0):(va>vb?-1:va<vb?1:0)}
    if(col==="state"){va=a.sn;vb=b.sn;return asc?(va<vb?-1:va>vb?1:0):(va>vb?-1:va<vb?1:0)}
    va=a[col]||0;vb=b[col]||0;return asc?va-vb:vb-va;
  });
  return sorted;
}

      var stFips=String(f.properties.s||"").padStart(2,"0");
      var ab=FIPS[stFips];
      if(!ab||ab==="DC")return;
      var dd=String(f.properties.d||"").trim();
      var dist=/^\d+$/.test(dd)?String(+dd):/at[- ]large/i.test(dd)||/00$/.test(gid)?"AL":null;
      if(dist===null)return;
      var dPad=dist==="AL"?"00":String(dist).padStart(2,"0");
      kept.push({f:f,abbr:ab,dist:dist,key:ab+"-"+dPad});
    });

    var distFC={type:"FeatureCollection",features:kept.map(function(k){return k.f})};
    var proj=d3.geoAlbersUsa().fitExtent([[0,0],[W,H]],distFC);
    var path=d3.geoPath(proj);

    // Compute paths and centroids
    var items=kept.map(function(k){
      var d=path(k.f);if(!d)return null;
      var c=path.centroid(k.f);

      .attr("stroke","rgba(255,255,255,.55)").attr("stroke-width",0.4).style("cursor","pointer")
      .on("mouseenter",function(ev,x){

        }else{h='<div style="font-weight:700;font-size:13px">'+x.key+'</div><div style="font-size:11px;color:#6e7689">No Republican candidate</div>'}

        hc.style.display="block";

    var stMesh10=topojson.mesh(STATES10M,STATES10M.objects.states,function(a,b){return a!==b});
    var stOutline10=d3.geoPath(proj)(stMesh10);

var listSelState="ALL";
var listSortCol="dist";
var listSortAsc=true;
function listSort(col){listSortAsc=sortOn(col,listSortCol,listSortAsc);listSortCol=col;render()}

function renderList(list){
  var sd=stateData(list);
  var stS=Object.values(sd).sort(function(a,b){return a.name<b.name?-1:1});
  var totalN=list.length;
  var side='<div class="md-side-search"><input type="text" placeholder="Search..." oninput="filterListSide(this.value)"></div>';
  side+='<div class="md-item'+(listSelState==="ALL"?" active":"")+'" onclick="listSelState=\'ALL\';render()"><span style="font-weight:700">National</span><span class="md-count">'+totalN+'</span></div>';
  stS.forEach(function(s){
    side+='<div class="md-item'+(s.code===listSelState?" active":"")+'" onclick="listSelState=\''+s.code+'\';render()">'
      +'<span>'+s.name+' ('+s.code+')</span><span class="md-count">'+s.n+'</span></div>';
  });
  var ms,title,count;
  if(listSelState==="ALL"){ms=list;title="National";count=totalN}
  else{var sel=sd[listSelState];if(!sel){ms=[];title="Select a state";count=0}else{ms=sel.members;title=sel.name+" ("+sel.code+")";count=sel.n}}
  ms=sortMembers(ms,listSortCol,listSortAsc);
  function ah(col,label){var isActive=listSortCol===col;return '<th class="sortable'+(col==="receipts"||col==="coh"||col==="disbursements"?" r":"")+'" onclick="listSort(\''+col+'\')">'+label+'<span class="arrow'+(isActive?" on":"")+'"> '+(isActive?(listSortAsc?"&#9650;":"&#9660;"):"&#9650;")+'</span></th>'}
  var detail='<div class="md-detail-head"><span>'+title+'</span><span class="md-count">'+count+'</span></div>';
  detail+='<div class="tw"><table><thead><tr>'+ah("dist","District")+ah("name","Name")+(listSelState==="ALL"?ah("state","State"):"")+ah("receipts","Raised")+ah("coh","COH")+ah("disbursements","Spent")+ah("indiv","Individual")+ah("pac","PAC")+'</tr></thead><tbody>';
  ms.forEach(function(m){
    detail+='<tr style="cursor:pointer" onclick="showCandidate(\''+m.dist+'\')" title="Click for details"><td><span class="bd">'+m.dist+'</span></td><td>'+m.name+'<span class="bs">'+m.type+'</span></td>'
      +(listSelState==="ALL"?'<td style="font-size:.72rem;color:var(--d)">'+m.sn+'</td>':'')
      +'<td class="mo">'+fmt(m.receipts)+'</td><td class="mo">'+fmt(m.coh)+'</td><td class="mo">'+fmt(m.disbursements)+'</td><td class="mo">'+fmt(m.indiv)+'</td><td class="mo">'+fmt(m.pac)+'</td></tr>'});
  detail+='</tbody></table></div>';

  document.getElementById("view").innerHTML='<div class="md-wrap"><div class="md-side" id="listSide">'+side+'</div><div class="md-detail">'+detail+'</div></div>';
}
function filterListSide(q){

      receipts:num(c.receipts),coh:num(c.cash_on_hand_end_period)||num(c.last_cash_on_hand_end_period),
      disbursements:num(c.disbursements),indiv:num(c.individual_contributions)||num(c.individual_itemized_contributions),
      pac:num(c.other_political_committee_contributions),candidateId:c.candidate_id,periods:[]};
  }).sort(function(a,b){return b.receipts-a.receipts});
}

function loadFEC(){
  setStatus("ok","Loading "+CYCLE+" cycle...");
  // data.json first (complete: 1071 candidates + quarterly), Vercel API refreshes in background
  function loadDJ(dj){
    DATA_CACHE=dj;
    var cycleData=dj.cycles?dj.cycles[CYCLE]:null;
    if(!cycleData||!cycleData.length)return false;
    ALL=parseFECCandidates(cycleData);
    var rKey=CYCLE+"_reports";
    var reports=dj.cycles?dj.cycles[rKey]:null;
    if(reports){ALL.forEach(function(m){var rpts=reports[m.candidateId];if(rpts)m.periods=rpts})}
    var updated=dj.updated?new Date(dj.updated).toLocaleDateString("en-US",{month:"numeric",day:"numeric",year:"numeric"}):"";
    setStatus("ok",ALL.length+" candidates ("+CYCLE+" cycle). Data as of "+updated+".");
    render();
    return true;
  }
  if(DATA_CACHE&&loadDJ(DATA_CACHE))return;
  // Try multiple sources in order
  var GH_DATA="https://raw.githubusercontent.com/TJHolden/fec-dashboard/main/data.json";
  
  function tryGitHub(){
    return fetch(GH_DATA).then(function(r){
      if(!r.ok)throw new Error("GitHub HTTP "+r.status);
      return r.json();
    }).then(function(dj){
      if(!loadDJ(dj))throw new Error("No data for cycle "+CYCLE);
    });
  }
  
  function tryVercel(){
    return fetch(VERCEL_API+"?cycle="+CYCLE).then(function(r){
      if(!r.ok)throw new Error("Vercel HTTP "+r.status);
      return r.json();
    }).then(function(d){
      if(!d.candidates||!d.candidates.length)throw new Error("No candidates returned");
      ALL=parseFECCandidates(d.candidates);
      setStatus("ok",ALL.length+" candidates ("+CYCLE+" cycle).");
      render();
      // Load quarterly in background
      fetch(GH_DATA).then(function(r){return r.json()}).then(function(dj){
        var rKey=CYCLE+"_reports";var reports=dj&&dj.cycles?dj.cycles[rKey]:null;
        if(reports){ALL.forEach(function(m){var rpts=reports[m.candidateId];if(rpts)m.periods=rpts});render()}
      }).catch(function(){});
    });
  }
  
  function tryLocal(){
    return fetch("data.json").then(function(r){
      if(!r.ok)throw new Error("Local HTTP "+r.status);
      return r.json();
    }).then(function(dj){
      if(!loadDJ(dj))throw new Error("No data for cycle "+CYCLE);
    });
  }

  tryGitHub().catch(function(e1){
    setStatus("ok","Loading from API...");
    tryVercel().catch(function(e2){
      tryLocal().catch(function(e3){
        setStatus("err","Could not load data. Please refresh the page.");
        ALL=[];render();
      });
    });
  });
}


function loadFromCache(){
  var SN_local=SN;
  var num=function(v){var n=parseFloat(v);return isNaN(n)?0:n};
  var cycleData=DATA_CACHE.cycles?DATA_CACHE.cycles[CYCLE]:null;
  if(!cycleData||!cycleData.length){
    ALL=[];
    setStatus("ok","No data for "+CYCLE+" cycle. Try a different cycle.");
    render();
    return;
  }
  ALL=cycleData.map(function(c){
    var nm=c.name||"";var parts=nm.split(",");
    var name=parts.length>=2?(parts[1].trim().split(" ")[0]+" "+parts[0].trim()).toLowerCase().replace(/(?:^|\s)\S/g,function(ch){return ch.toUpperCase()}).replace(/  +/g," "):nm.toLowerCase().replace(/(?:^|\s)\S/g,function(ch){return ch.toUpperCase()});
    var dnum=c.district_number!=null?c.district_number:c.district;
    var dstr=(dnum===0||dnum==="0"||dnum==null||dnum==="")?"00":String(dnum).padStart(2,"0");
    var dist=c.state+"-"+dstr;
    return{name:name,state:c.state,sn:SN_local[c.state]||c.state,dist:dist,office:c.office||"H",
      type:c.incumbent_challenge==="I"?"Incumbent":c.incumbent_challenge==="C"?"Challenger":"Open",
      receipts:num(c.receipts),coh:num(c.cash_on_hand_end_period)||num(c.last_cash_on_hand_end_period),
      disbursements:num(c.disbursements),indiv:num(c.individual_contributions)||num(c.individual_itemized_contributions),
      pac:num(c.other_political_committee_contributions),candidateId:c.candidate_id,periods:[]};
  }).sort(function(a,b){return b.receipts-a.receipts});
  // Load quarterly reports from cache
  var rKey=CYCLE+"_reports";
  var reports=DATA_CACHE.cycles?DATA_CACHE.cycles[rKey]:null;
  var RL={Q1:"Q1",Q2:"Q2",Q3:"Q3",Q4:"Q4","12P":"Pre-Primary","12C":"Pre-Convention","12G":"Pre-General","30G":"Post-General",YE:"Year-End"};
  if(reports){
    ALL.forEach(function(m){
      var rpts=reports[m.candidateId];
      if(rpts)m.periods=rpts;
    });
  }
  var updated=DATA_CACHE.updated?new Date(DATA_CACHE.updated).toLocaleDateString():"unknown";
  setStatus("ok",ALL.length+" candidates ("+CYCLE+" cycle). Data as of "+updated+".");
  render();
}

function fetchFECData(cb){
  var ctrl=new AbortController();
  setTimeout(function(){ctrl.abort()},12000);
  fetch(BASE_URL+"/candidates/totals/?api_key="+API_KEY+"&party=REP&office=H&cycle="+CYCLE+"&election_year="+CYCLE+"&is_active_candidate=true&sort_by=-receipts&per_page=100",{signal:ctrl.signal})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
    .then(function(d){
      if(!d.results||!d.results.length)throw new Error("No results");
      var total=d.pagination?d.pagination.pages:1;
      var allResults=d.results;
      setStatus("ok","Found "+d.pagination.count+" candidates. Loading all pages...");
      var promises=[];
      for(var p=2;p<=Math.min(total,20);p++){
        promises.push(fetch(BASE_URL+"/candidates/totals/?api_key="+API_KEY+"&party=REP&office=H&cycle="+CYCLE+"&election_year="+CYCLE+"&is_active_candidate=true&sort_by=-receipts&per_page=100&page="+p).then(function(r){return r.json()}));
      }
      // House only - no Senate
      return Promise.all(promises).then(function(pages){
        pages.forEach(function(pg){if(pg.results)allResults=allResults.concat(pg.results)});
        return allResults;
      });
    })
    .then(function(results){
      var seen={};
      results.forEach(function(c){var id=c.candidate_id;if(!seen[id]||(c.receipts||0)>(seen[id].receipts||0))seen[id]=c});
      var uniq=Object.values(seen);
      var num=function(v){var n=parseFloat(v);return isNaN(n)?0:n};
      setStatus("ok",ALL.length+" Republican candidates loaded. Loading quarterly reports...");
      render();
      // Now fetch quarterly reports for incumbents
      // quarterly reports already loaded from API
    })
    .catch(function(err){
      setStatus("err","Could not reach the FEC API. Host this file on a web server (GitHub Pages, Netlify, etc.) for live data.");
      ALL=[];
      render();
    });
}

function loadQuarterlyForCycle(cy){
  // Clear existing periods and reload for the new cycle
  ALL.forEach(function(m){m.periods=[]});
  qtrCycle=cy;
  loadQuarterlyReports(cy);
}

function loadQuarterlyReports(overrideCycle){
  var useCycle=overrideCycle||CYCLE;
  var candidates=ALL.filter(function(m){return m.candidateId&&(m.type==="Incumbent"||m.receipts>100000)});
  if(!candidates.length)return;
  var batches=[];
  for(var i=0;i<candidates.length;i+=20){batches.push(candidates.slice(i,i+20))}
  var done=0;
  var RL={"Q1":"Q1","Q2":"Q2","Q3":"Q3","Q4":"Q4","12P":"Pre-Primary","12C":"Pre-Convention","12G":"Pre-General","30G":"Post-General","YE":"Year-End"};
  function doBatch(batch){
    var ids=batch.map(function(m){return m.candidateId});
    var url=BASE_URL+"/reports/house-senate/?api_key="+API_KEY+"&candidate_id="+ids.join("&candidate_id=")+"&cycle="+useCycle+"&per_page=100&sort_by=-coverage_end_date";
    return fetch(url).then(function(r){return r.json()}).then(function(d){
      if(!d.results)return;
      d.results.forEach(function(rpt){
        var cid=rpt.candidate_id;
        var member=ALL.find(function(m){return m.candidateId===cid});
        if(!member)return;
        var rt=rpt.report_type||"";
        var year=rpt.coverage_end_date?rpt.coverage_end_date.substring(0,4):"";
        var label=(RL[rt]||rt)+" "+year;
        if(member.periods.find(function(p){return p.label===label}))return;
        member.periods.push({label:label,raised:parseFloat(rpt.receipts)||0,coh:parseFloat(rpt.cash_on_hand_end_period)||0});
      });
      done++;
      if(done%5===0||done===batches.length){
        setStatus("ok",ALL.length+" candidates, "+done+"/"+batches.length+" report batches ("+useCycle+" cycle).");
        render();
        // Cache quarterly data
        if(done===batches.length){
          try{var qcKey="fec_qcache_"+useCycle;var qp={};ALL.forEach(function(m){if(m.periods&&m.periods.length)qp[m.candidateId]=m.periods});localStorage.setItem(qcKey,JSON.stringify({periods:qp}))}catch(e){}
        }
      }
    }).catch(function(){done++});
  }
  var delay=0;
  batches.forEach(function(batch){setTimeout(function(){doBatch(batch)},delay);delay+=600});
}
