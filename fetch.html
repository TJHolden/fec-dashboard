<!DOCTYPE html>
<html><head><title>FEC Data Updater</title></head>
<body style="font-family:system-ui;max-width:600px;margin:40px auto;padding:20px">
<h2>FEC Data Updater</h2>
<p>Fetches all Republican House candidate data and saves it to GitHub.</p>
<div id="status" style="padding:12px;background:#f0f0f0;border-radius:6px;margin:16px 0;white-space:pre-wrap;max-height:400px;overflow-y:auto">Ready</div>
<div style="margin-bottom:12px">
  <label style="font-size:14px;font-weight:600">GitHub Token:</label><br>
  <input id="tok" type="password" style="width:100%;padding:8px;margin-top:4px;border:1px solid #ccc;border-radius:4px">
</div>
<button id="btn" onclick="go()" style="padding:12px 24px;font-size:16px;background:#a62422;color:white;border:none;border-radius:6px;cursor:pointer">Update FEC Data Now</button>
<script>
var FEC_KEY="tPKgQ8WnMDRqrqMzfzLgd6KfmN7t8wMH9WNbcqpJ";
var GH_TOKEN="";
var BASE="https://api.open.fec.gov/v1";
var REPO="TJHolden/fec-dashboard";
var st=document.getElementById("status");
var tokInput=document.getElementById("tok");
try{var saved=localStorage.getItem("gh_token");if(saved){tokInput.value=saved;GH_TOKEN=saved;}}catch(e){}
tokInput.addEventListener("input",function(){GH_TOKEN=this.value;try{localStorage.setItem("gh_token",this.value);}catch(e){}});

function log(msg){st.textContent+="\n"+msg;st.scrollTop=999999;}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

async function fetchWithRetry(url,retries){
  retries=retries||3;
  for(var i=0;i<retries;i++){
    var r=await fetch(url);
    if(r.ok)return r.json();
    if(r.status===429){
      var wait=Math.pow(2,i)*15000;
      log("  Rate limited. Waiting "+Math.round(wait/1000)+"s...");
      await sleep(wait);
    }else{throw new Error("HTTP "+r.status);}
  }
  throw new Error("Rate limited after retries");
}

async function fetchCycle(cycle){
  log("Fetching "+cycle+" cycle...");
  var d=await fetchWithRetry(BASE+"/candidates/totals/?api_key="+FEC_KEY+"&party=REP&office=H&cycle="+cycle+"&election_year="+cycle+"&is_active_candidate=true&sort_by=-receipts&per_page=100&page=1");
  if(!d.results){log("  no results");return[];}
  var results=d.results;
  var pages=d.pagination?d.pagination.pages:1;
  log("  "+d.pagination.count+" candidates, "+pages+" pages");
  for(var p=2;p<=Math.min(pages,20);p++){
    await sleep(700);
    try{var d2=await fetchWithRetry(BASE+"/candidates/totals/?api_key="+FEC_KEY+"&party=REP&office=H&cycle="+cycle+"&election_year="+cycle+"&is_active_candidate=true&sort_by=-receipts&per_page=100&page="+p);
      if(d2.results)results=results.concat(d2.results);}catch(e){log("  page "+p+" error: "+e.message);}
  }
  var seen={};
  results.forEach(function(c){var id=c.candidate_id;if(!seen[id]||(c.receipts||0)>(seen[id].receipts||0))seen[id]=c;});
  var uniq=Object.values(seen);
  log("  "+uniq.length+" unique candidates");
  return uniq;
}

async function fetchReports(candidates,cycle){
  log("Fetching "+cycle+" quarterly reports for "+candidates.length+" candidates...");
  var RL={Q1:"Q1",Q2:"Q2",Q3:"Q3",Q4:"Q4","12P":"Pre-Primary","12C":"Pre-Convention","12G":"Pre-General","30G":"Post-General",YE:"Year-End",MY:"Mid-Year"};
  var reports={};
  var done=0;
  // Fetch both current and prior cycle for 2 years of data
  var cyclesToFetch=[cycle,cycle-2];
  for(var ci=0;ci<cyclesToFetch.length;ci++){
    var cy=cyclesToFetch[ci];
    log("  Cycle "+cy+"...");
    for(var i=0;i<candidates.length;i++){
      var c=candidates[i];
      var cid=c.candidate_id;
      done++;
      if(done%50===0||done===1)log("  candidate "+done+"/"+candidates.length*cyclesToFetch.length);
      try{var d=await fetchWithRetry(BASE+"/reports/house-senate/?api_key="+FEC_KEY+"&candidate_id="+cid+"&cycle="+cy+"&per_page=100&sort_by=-coverage_end_date");
        if(d.results&&d.results.length){
          if(!reports[cid])reports[cid]=[];
          d.results.forEach(function(rpt){
            var rt=rpt.report_type||"";var year=rpt.coverage_end_date?rpt.coverage_end_date.substring(0,4):"";
            var label=(RL[rt]||rt)+" "+year;
            if(!reports[cid].find(function(p){return p.label===label;})){
              reports[cid].push({label:label,raised:rpt.total_receipts_period||0,coh:rpt.cash_on_hand_end_period||0,spent:rpt.total_disbursements_period||0,indiv:+(rpt.total_individual_contributions_period)||0,pac:rpt.other_political_committee_contributions_period||0,end:rpt.coverage_end_date||""});
            }
          });
        }
      }catch(e){}
      await sleep(350);
    }
    await sleep(2000);
  }
  // Sort each candidate most recent first
  Object.keys(reports).forEach(function(k){reports[k].sort(function(a,b){return(b.end||"").localeCompare(a.end||"")})});
  log("  "+Object.keys(reports).length+" candidates have quarterly data");
  return reports;
}

async function commitToGitHub(data){
  log("\nCommitting data.json to GitHub...");
  var json=JSON.stringify(data);
  log("Data size: "+(json.length/1024/1024).toFixed(1)+" MB");
  var content=btoa(unescape(encodeURIComponent(json)));
  var sha=null;
  try{var r=await fetch("https://api.github.com/repos/"+REPO+"/contents/data.json",{headers:{"Authorization":"Bearer "+GH_TOKEN}});
    if(r.ok){var d=await r.json();sha=d.sha;}}catch(e){}
  var body={message:"Update FEC data "+new Date().toISOString().split("T")[0],content:content};
  if(sha)body.sha=sha;
  var r2=await fetch("https://api.github.com/repos/"+REPO+"/contents/data.json",{
    method:"PUT",headers:{"Authorization":"Bearer "+GH_TOKEN,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(r2.ok){log("\nDone! data.json committed to GitHub.\nDashboard will load instantly now.\nRefresh: tjholden.github.io/fec-dashboard/");}
  else{var err=await r2.text();log("GitHub error: "+err);}
}

async function go(){
  if(!GH_TOKEN){st.textContent="Enter your GitHub token above first.";return;}
  document.getElementById("btn").disabled=true;
  st.textContent="Starting...";
  try{
    var data={updated:new Date().toISOString(),cycles:{}};
    var cycles=[2028,2026,2024,2022,2020,2018,2016,2014,2012];
    for(var ci=0;ci<cycles.length;ci++){
      data.cycles[cycles[ci]]=await fetchCycle(cycles[ci]);
      await sleep(2000);
    }
    // Commit candidates first so we don't lose them
    log("\nCommitting candidates...");
    await commitToGitHub(data);
    
    // Now fetch 2026 quarterly reports only (2024 takes too long)
    var cy=2026;
    if(data.cycles[cy]&&data.cycles[cy].length){
      var inc=data.cycles[cy].filter(function(c){return c.incumbent_challenge==="I"||(c.receipts||0)>50000;});
      data.cycles[cy+"_reports"]=await fetchReports(inc,cy);
      data.updated=new Date().toISOString();
      log("\nCommitting with quarterly data...");
      await commitToGitHub(data);
    }
    log("\nAll done! Dashboard will load instantly now.");
  }catch(e){log("\nError: "+e.message+"\n\nTry clicking the button again.");}
  document.getElementById("btn").disabled=false;
}
</script>
</body>
</html>
